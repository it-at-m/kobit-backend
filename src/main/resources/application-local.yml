spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/kobit_local;
    username: postgres
    password: kobit-local


  http:
    log-request-details: on

  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME}
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      hostname: ${AWS_S3_HOSTNAME}
      region:
        static: eu-central-1
        auto: false