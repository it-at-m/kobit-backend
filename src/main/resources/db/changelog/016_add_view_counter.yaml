databaseChangeLog:
  - changeSet:
      id: view-counter-table-add
      author: langehm
      preConditions:
        - not:
            - tableExists:
                tableName: view_counter
      changes:
        - createTable:
            tableName: view_counter
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: category
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: value
                  type: bigint
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
              - column:
                  name: deactivated_at
                  type: timestamp
        - insert:
            tableName: view_counter
            columns:
              - column:
                  name: id
                  value: "cc4a73d3-f59c-4075-9aa1-98dffbd6ec60"
              - column:
                  name: category
                  value: "E_MAIL_SEND_COUNTER"
              - column:
                  name: value
                  valueNumeric: "0"
        - insert:
            tableName: view_counter
            columns:
              - column:
                  name: id
                  value: "db956e18-26e4-43c0-b70f-0d9180f15de9"
              - column:
                  name: category
                  value: "PAGE_VISITED_COUNTER"
              - column:
                  name: value
                  valueNumeric: "0"
      rollback:
        - dropTable:
            tableName: view_counter
